name: Finalize reproducibility bundle

on:
  push:
    branches: [repro-finalization-20260915]
    paths:
      - '.github/workflows/finalize-repro-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repro-finalization-20260915
          fetch-depth: 0

      - name: Download verified release archive
        env:
          RELEASE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-f08c-8210-82f4-8e965460721a/raw?se=2026-09-15T11%3A48%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=829bd7bc-18dd-5239-ba2f-448cbdf6cbd3&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T04%3A23%3A48Z&ske=2026-09-16T04%3A23%3A48Z&sks=b&skv=2026-02-06&sig=XpBl/8uTgNQftPEoUwrSnTUzMflK7E43RNRofcuEd4k%3D"
        run: |
          curl --fail --location --retry 3 "$RELEASE_URL" -o semantic_coherence_public_release.tar.xz
          echo "a68f1be48e32b28a683431b093649999c9fb7f19af2130d87fca5f03f9f9260d  semantic_coherence_public_release.tar.xz" | sha256sum -c -
          test "$(stat -c%s semantic_coherence_public_release.tar.xz)" = "641012"

      - name: Build text-safe transport parts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          archive = Path('semantic_coherence_public_release.tar.xz').read_bytes()
          b64 = base64.b64encode(archive).decode('ascii')
          out = Path('release_bundle')
          out.mkdir(exist_ok=True)
          for p in out.glob('semantic_coherence_public_release.tar*.part*'):
              p.unlink()
          chunks = [b64[i:i+10000] for i in range(0, len(b64), 10000)]
          for i, chunk in enumerate(chunks, 1):
              (out / f'semantic_coherence_public_release.tar.xz.b64.part{i:04d}').write_text(chunk, encoding='ascii')
          assert len(chunks) == 86
          assert sum(len(p.read_text()) for p in sorted(out.glob('semantic_coherence_public_release.tar.xz.b64.part*'))) == len(b64)
          PY

      - name: Verify round trip
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts = sorted(Path('release_bundle').glob('semantic_coherence_public_release.tar.xz.b64.part*'))
          assert len(parts) == 86, len(parts)
          raw = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          assert hashlib.sha256(raw).hexdigest() == 'a68f1be48e32b28a683431b093649999c9fb7f19af2130d87fca5f03f9f9260d'
          assert len(raw) == 641012
          print('PASS: 86 parts reconstruct the verified archive')
          PY

      - name: Commit generated transport
        run: |
          rm -f semantic_coherence_public_release.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release_bundle
          if git diff --cached --quiet; then
            echo "No transport changes to commit"
          else
            git commit -m "Finalize verified reproducibility bundle transport"
            git push origin HEAD:repro-finalization-20260915
          fi
