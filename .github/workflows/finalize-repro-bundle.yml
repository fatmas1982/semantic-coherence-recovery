name: Install final reproducibility documentation

on:
  push:
    branches: [repro-finalization-20260915]
    paths:
      - '.github/workflows/finalize-repro-bundle.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repro-finalization-20260915
          fetch-depth: 0

      - name: Download and verify final documentation bundle
        env:
          DOCS_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-984c-8246-8683-ac24321f2de8/raw?se=2026-09-15T11%3A52%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=1b4bd24f-c0cd-5a0c-98c1-53a9e9681460&skoid=b5d2651b-fef3-4bb0-a03b-ca59cc22929b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A05%3A59Z&ske=2026-09-16T06%3A05%3A59Z&sks=b&skv=2026-02-06&sig=XJsB3CXKI/yrXiOgXqkcYS0AZAZl4086e//Bz3AU5Kg%3D"
        run: |
          curl --fail --location --retry 3 "$DOCS_URL" -o /tmp/github_final_docs.tar.gz
          echo "18d00b2374395b73f331de39a705b6bbdbe9e46bda6d1b00d10a9648bb0ed289  /tmp/github_final_docs.tar.gz" | sha256sum -c -
          test "$(stat -c%s /tmp/github_final_docs.tar.gz)" = "11111"

      - name: Install final public files and self-remove workflow
        run: |
          tar -xzf /tmp/github_final_docs.tar.gz -C .
          python -m py_compile UNPACK_RELEASE.py
          grep -q "EXPECTED_PARTS = 86" UNPACK_RELEASE.py
          grep -q "a68f1be48e32b28a683431b093649999c9fb7f19af2130d87fca5f03f9f9260d" BUNDLE_SHA256.txt
          test -f docs/RELEASE_VERIFICATION.json
          test -f docs/REPRODUCIBILITY.md
          test -f SOURCE_BINARY_HASHES.csv
          test -f PUBLIC_METRICS_RECOMPUTED.csv
          test -f LICENSE
          test -f DATA_LICENSE.md
          rm -f .github/workflows/finalize-repro-bundle.yml
          rm -rf __pycache__

      - name: Commit final documentation state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install final reproducibility documentation and remove transient workflow"
          git push origin HEAD:repro-finalization-20260915
