name: Finalize corrected reproducibility release v2
on:
  push:
    paths: ['.github/workflows/finalize-release-v2.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install verification dependencies
        run: python -m pip install -q pandas scikit-learn
      - name: Rebuild and verify corrected release
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64,csv,hashlib,json,re,shutil,subprocess,sys,tarfile,tempfile
          R=Path.cwd(); D=R/'release_bundle'; P='semantic_coherence_public_release.tar.xz.b64.part'
          O='a95b0eb609c001a3dc54f5a60a8bdd3c8237aa7009b63ddddb0a1e82f652fb51'; N=86
          H=lambda b:hashlib.sha256(b).hexdigest()
          def ext(tf,d):
              try: tf.extractall(d,filter='data')
              except TypeError: tf.extractall(d)
          def manifest(w):
              rows=[]
              for p in sorted(w.rglob('*')):
                  if p.is_file() and p.name!='SHA256SUMS.csv':
                      b=p.read_bytes(); rows.append((p.relative_to(w).as_posix(),len(b),H(b)))
              with (w/'SHA256SUMS.csv').open('w',encoding='utf-8',newline='') as f:
                  z=csv.writer(f); z.writerow(['path','bytes','sha256']); z.writerows(rows)
              return len(rows)
          def verify(w):
              with (w/'SHA256SUMS.csv').open(encoding='utf-8',newline='') as f: rows=list(csv.DictReader(f))
              bad=[]
              for x in rows:
                  p=w/x['path']
                  if not p.is_file(): bad.append((x['path'],'missing')); continue
                  b=p.read_bytes()
                  if len(b)!=int(x['bytes']) or H(b)!=x['sha256']: bad.append((x['path'],'mismatch'))
              if bad: raise SystemExit(f'manifest failure: {bad[:10]}')
              return len(rows)
          def audit(w):
              ban=['data/annotation/historical_full/','not in the currently deposited package','not reconstructed from missing files','not reconstructed from unavailable files','byte-identical public copy under data/annotation/historical_full/','Exact historical A1/A2/A3 workbooks released','Exact byte-identical historical workbook released','P2_57_Submission_Candidate']
              hit=[]
              for p in w.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.md','.csv','.json','.py','.txt','.cff'}:
                      try:t=p.read_text(encoding='utf-8')
                      except UnicodeDecodeError:continue
                      hit += [(p.relative_to(w).as_posix(),s) for s in ban if s in t]
              if hit: raise SystemExit(f'stale-claim failure: {hit[:20]}')
          oldparts=sorted(D.glob(P+'*'))
          if len(oldparts)!=N: raise SystemExit(f'expected {N} old parts, got {len(oldparts)}')
          old=base64.b64decode(''.join(x.read_text().strip() for x in oldparts),validate=True)
          oldsha=(R/'BUNDLE_SHA256.txt').read_text().split()[0]
          if H(old)!=oldsha: raise SystemExit('old bundle hash mismatch')
          op=sorted((R/'.release_patch').glob('overlay.b64.part*'))
          if len(op)!=8: raise SystemExit(f'expected 8 overlay fragments, got {len(op)}')
          ov=base64.b64decode(''.join(x.read_text().strip() for x in op),validate=True)
          if H(ov)!=O: raise SystemExit('overlay hash mismatch')
          with tempfile.TemporaryDirectory() as td0:
              td=Path(td0); w=td/'release'; w.mkdir()
              a=td/'old.tar.xz'; a.write_bytes(old)
              with tarfile.open(a,'r:xz') as tf: ext(tf,w)
              a=td/'overlay.tar.xz'; a.write_bytes(ov)
              with tarfile.open(a,'r:xz') as tf: ext(tf,w)
              for q in ['paper/P2_57_Submission_Candidate_MANUSCRIPT.md','paper/P2_57_Submission_Candidate_SUPPLEMENT.md']:(w/q).unlink(missing_ok=True)
              req=['data/annotation/historical_full_csv/A1/Annotation.csv','data/annotation/historical_full_csv/A2/Annotation.csv','data/annotation/historical_full_csv/A3/Annotation.csv','data/annotation/historical_full_csv/ROUND1_ADJ/Adjudication.csv','paper/P2_58_FINAL_SUBMISSION_READY_PENDING_AUTHOR_METADATA_MANUSCRIPT.md','paper/P2_58_FINAL_SUBMISSION_READY_PENDING_AUTHOR_METADATA_SUPPLEMENT.md']
              for q in req:
                  if not (w/q).is_file(): raise SystemExit(f'missing {q}')
              if (w/'data/annotation/historical_full').exists(): raise SystemExit('obsolete historical_full exists')
              audit(w)
              if manifest(w)!=151 or verify(w)!=151: raise SystemExit('manifest row-count failure')
              subprocess.run([sys.executable,'code/analysis/reproduce_public_metrics.py'],cwd=w,check=True)
              out=td/'new.tar.xz'; mt=1789430400
              def norm(x): x.uid=x.gid=0;x.uname=x.gname='';x.mtime=mt;return x
              with tarfile.open(out,'w:xz') as tf:
                  for c in sorted(w.iterdir(),key=lambda x:x.name): tf.add(c,arcname=c.name,recursive=True,filter=norm)
              b=out.read_bytes(); newsha=H(b); enc=base64.b64encode(b).decode(); chunks=[enc[i:i+10000] for i in range(0,len(enc),10000)]
              if len(chunks)!=N: raise SystemExit(f'new archive produced {len(chunks)} parts')
              shutil.rmtree(D);D.mkdir()
              for i,c in enumerate(chunks,1):(D/f'{P}{i:04d}').write_text(c,encoding='ascii')
              rt=base64.b64decode(''.join((D/f'{P}{i:04d}').read_text().strip() for i in range(1,N+1)),validate=True)
              if rt!=b or H(rt)!=newsha: raise SystemExit('fragment roundtrip failure')
              v=td/'verify';v.mkdir();a=td/'verify.tar.xz';a.write_bytes(rt)
              with tarfile.open(a,'r:xz') as tf: ext(tf,v)
              if verify(v)!=151: raise SystemExit('verified manifest failure')
              audit(v);subprocess.run([sys.executable,'code/analysis/reproduce_public_metrics.py'],cwd=v,check=True)
              (R/'BUNDLE_SHA256.txt').write_text(f'{newsha}  semantic_coherence_public_release.tar.xz\n')
              u=(R/'UNPACK_RELEASE.py').read_text();u=re.sub(r'EXPECTED_SHA256 = "[0-9a-f]{64}"',f'EXPECTED_SHA256 = "{newsha}"',u);(R/'UNPACK_RELEASE.py').write_text(u)
              p=R/'README.md';p.write_text(p.read_text().replace(oldsha,newsha))
              p=R/'docs/RELEASE_VERIFICATION.json';j=json.loads(p.read_text());j['github_transport']={'format':'Base64 fragments','parts':N,'archive_bytes':len(b),'archive_sha256':newsha,'roundtrip_status':'PASS'};p.write_text(json.dumps(j,indent=2)+'\n')
              print('FINAL_RELEASE_REBUILD_PASS',newsha,len(b),len(chunks),len(chunks[-1]))
          PY
      - name: Commit final release and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release_patch
          rm -f .github/workflows/finalize-release-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Rebuild corrected publication reproducibility release'
          git push origin HEAD:main
